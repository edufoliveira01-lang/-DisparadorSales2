name: Atualizar Ubuntu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-disparazap-b
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, disparazap]
    timeout-minutes: 45
    steps:
      - name: Preparar e publicar atualização seletiva
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          APP=/home/dropsales/disparador-sales2
          BACKUPS=/home/dropsales/disparazap-backups
          export PM2_HOME=/home/dropsales/.pm2
          # O /tmp deste servidor é uma partição pequena (1 GB) e já encheu, derrubando testes e
          # publicações com ENOSPC. Tudo o que é temporário vai para o disco principal.
          export TMPDIR=/home/dropsales/.cache/disparazap-tmp
          mkdir -p "$TMPDIR"
          find "$TMPDIR" -mindepth 1 -maxdepth 1 -mmin +120 -exec rm -rf -- {} + 2>/dev/null || true
          exec 9>/home/dropsales/.disparazap-deploy.lock
          flock -n 9
          cd "$APP"
          test -z "$(git status --porcelain)"
          git fetch origin main
          git cat-file -e "$GITHUB_SHA^{commit}"
          git merge-base --is-ancestor HEAD "$GITHUB_SHA"
          # Executa a sonda somente quando seu próprio arquivo muda. A leitura ocorre antes
          # de parar o backend e não expõe QR, conta, endpoint DevTools ou conversas.
          RUN_WHATSAPP_DIAGNOSTIC=false
          if git cat-file -e "$GITHUB_SHA:server/scripts/diagnose-whatsapp.cjs" 2>/dev/null && ! git diff --quiet HEAD "$GITHUB_SHA" -- server/scripts/diagnose-whatsapp.cjs; then
            RUN_WHATSAPP_DIAGNOSTIC=true
            DIAGNOSTIC=$(mktemp "$TMPDIR/disparazap-whatsapp-diagnostic-XXXXXX.cjs")
            git show "$GITHUB_SHA:server/scripts/diagnose-whatsapp.cjs" > "$DIAGNOSTIC"
            timeout 30s node "$DIAGNOSTIC" "$APP" || true
            rm -f -- "$DIAGNOSTIC"
          fi
          
          # Compara eventos sem escrever nas agendas nem expor títulos ou credenciais.
          if git cat-file -e "$GITHUB_SHA:server/scripts/diagnose-google-calendar.cjs" 2>/dev/null && ! git diff --quiet HEAD "$GITHUB_SHA" -- server/scripts/diagnose-google-calendar.cjs; then
            CALENDAR_DIAGNOSTIC=$(mktemp "$TMPDIR/disparazap-calendar-diagnostic-XXXXXX.cjs")
            git show "$GITHUB_SHA:server/scripts/diagnose-google-calendar.cjs" > "$CALENDAR_DIAGNOSTIC"
            timeout 90s node "$CALENDAR_DIAGNOSTIC" "$APP" || true
            rm -f -- "$CALENDAR_DIAGNOSTIC"
          fi

          SERVER=false
          CLIENT=false
          ROOT_DEPS=false
          SERVER_DEPS=false
          CLIENT_DEPS=false
          # Compara o conteúdo dos manifestos, ignorando apenas a versão
          # do próprio projeto. Versões das bibliotecas continuam sendo consideradas.
          deps_changed() {
            node - "$1" "$GITHUB_SHA" <<'NODE'
          const { execFileSync } = require("node:child_process");
          const [path, target] = process.argv.slice(2);
          function read(ref) {
            try { return JSON.parse(execFileSync("git", ["show", ref + ":" + path], {encoding:"utf8", stdio:["ignore","pipe","ignore"]})); }
            catch { return null; }
          }
          function normalize(value) {
            if (!value) return value;
            delete value.version;
            if (path.endsWith("package-lock.json") || path.endsWith("npm-shrinkwrap.json")) {
              if (value.packages && value.packages[""]) delete value.packages[""].version;
              // O vínculo file:.. também representa o próprio projeto, não uma biblioteca externa.
              if (value.packages?.[".."]?.name === "disparador-pericias") delete value.packages[".."].version;
            }
            function sorted(v) {
              if (Array.isArray(v)) return v.map(sorted);
              if (v && typeof v === "object") return Object.fromEntries(Object.keys(v).sort().map(k => [k, sorted(v[k])]));
              return v;
            }
            return sorted(value);
          }
          const before = read("HEAD"), after = read(target);
          // Arquivo novo, removido ou inválido: reinstala por precaução.
          console.log(!before || !after || JSON.stringify(normalize(before)) !== JSON.stringify(normalize(after)) ? "true" : "false");
          NODE
          }
          classify() {
            case "$1" in
              .github/*|docs/*|*.md|LICENSE|LICENSE.*|server/tests/*|client/tests/*|server/scripts/diagnose-*.cjs) ;;
              package.json|package-lock.json|npm-shrinkwrap.json)
                if [ "$1" = package.json ]; then SERVER=true; CLIENT=true; fi
                if [ "$(deps_changed "$1")" = true ]; then
                  ROOT_DEPS=true; SERVER_DEPS=true; CLIENT_DEPS=true; SERVER=true; CLIENT=true
                else
                  echo "Sem mudança de dependências: $1"
                fi ;;
              .npmrc)
                ROOT_DEPS=true; SERVER_DEPS=true; CLIENT_DEPS=true; SERVER=true; CLIENT=true ;;
              server/package.json|server/package-lock.json|server/npm-shrinkwrap.json)
                if [ "$1" = server/package.json ]; then SERVER=true; fi
                if [ "$(deps_changed "$1")" = true ]; then SERVER_DEPS=true; SERVER=true
                else echo "Sem mudança de dependências: $1"; fi ;;
              client/package.json|client/package-lock.json|client/npm-shrinkwrap.json)
                if [ "$1" = client/package.json ]; then CLIENT=true; fi
                if [ "$(deps_changed "$1")" = true ]; then CLIENT_DEPS=true; CLIENT=true
                else echo "Sem mudança de dependências: $1"; fi ;;
              server/.npmrc) SERVER_DEPS=true; SERVER=true ;;
              client/.npmrc) CLIENT_DEPS=true; CLIENT=true ;;
              server/*) SERVER=true ;;
              client/*) CLIENT=true ;;
              *) SERVER=true; CLIENT=true ;;
            esac
          }
          while IFS= read -r -d '' arquivo; do
            printf 'Alterado: %s\n' "$arquivo"
            classify "$arquivo"
          done < <(git diff --no-renames --name-only -z HEAD "$GITHUB_SHA")
          
          # Uma primeira instalação ou cache ausente exige preparar a parte correspondente.
          if [ "$SERVER" = true ] || [ "$CLIENT" = true ]; then
            if [ ! -d node_modules ]; then ROOT_DEPS=true; fi
            if [ "$SERVER" = true ] && [ ! -d server/node_modules ]; then SERVER_DEPS=true; fi
            if [ "$CLIENT" = true ] && [ ! -d client/node_modules ]; then CLIENT_DEPS=true; fi
          fi
          echo "Servidor: $SERVER | Interface: $CLIENT"
          echo "Instalar dependências: raiz=$ROOT_DEPS servidor=$SERVER_DEPS interface=$CLIENT_DEPS"
          if [ "$SERVER" = false ] && [ "$CLIENT" = false ]; then
            git merge --ff-only "$GITHUB_SHA"
            echo "Somente documentação/configuração do fluxo: nenhum serviço reiniciado."
            exit 0
          fi
          
          STAGE=$(mktemp -d /home/dropsales/disparazap-build-XXXXXX)
          STOPPED=false
          PUBLISHING=false
          PREVIOUS=$(git -C "$APP" rev-parse HEAD)
          BACKUP=""
          cleanup() {
            result=$?
            trap - EXIT
            if [ "$result" -ne 0 ] && [ "$PUBLISHING" = true ]; then
              echo "Falha na publicação. Restaurando código e interface anteriores."
              cd "$APP"
              if [ "$SERVER" = true ]; then pm2 stop disparador-backend || true; fi
              # A árvore estava limpa ao iniciar e o lock impede outro deploy simultâneo.
              git reset --hard "$PREVIOUS" || { echo "ERRO: restauração do código falhou"; exit 1; }
              if [ -d "$BACKUP/dist-anterior" ]; then
                rm -rf server/dist
                cp -a "$BACKUP/dist-anterior" server/dist
              fi
              for entry in 'root-node_modules-anterior:node_modules' 'node_modules-anterior:server/node_modules' 'client-node_modules-anterior:client/node_modules'; do
                source="${entry%%:*}"; destination="${entry#*:}"
                if [ -d "$BACKUP/$source" ]; then
                  rm -rf -- "$destination"
                  mv "$BACKUP/$source" "$destination"
                fi
              done
              if [ -f "$BACKUP/interface.tar.gz" ]; then tar -xzf "$BACKUP/interface.tar.gz" -C /var/www; fi
              # O banco em uso é preservado: não se descartam operações realizadas durante o deploy.
              if [ "$SERVER" = true ]; then
                RUNNER_TRACKING_ID="" pm2 restart disparador-backend --update-env || true
                STOPPED=false
              fi
              RESTORED=false
              for tentativa in {1..30}; do
                if curl --max-time 5 -fsS http://127.0.0.1:8081/api/health; then RESTORED=true; break; fi
                sleep 2
              done
              if [ "$RESTORED" = true ]; then
                echo "Versão anterior restaurada e API disponível."
              else
                echo "ERRO: a API anterior também não respondeu; consulte o PM2 e o backup: $BACKUP"
              fi
            fi
            if [ "$STOPPED" = true ]; then
              RUNNER_TRACKING_ID="" pm2 restart disparador-backend --update-env || true
            fi
            rm -rf -- "$STAGE"
            exit "$result"
          }
          trap cleanup EXIT
          git archive "$GITHUB_SHA" | tar -x -C "$STAGE"
          cd "$STAGE"
          if [ "$ROOT_DEPS" = true ]; then
            npm install
          else
            cp -a --reflink=auto "$APP/node_modules" node_modules
          fi
          # Os testes de integração usam servidor e cliente, mesmo em alterações de um só módulo.
          if [ "$SERVER_DEPS" = true ] || [ ! -d "$APP/server/node_modules" ]; then
            npm ci --prefix server --include=optional
            npm run codex:install --prefix server
          else
            cp -a --reflink=auto "$APP/server/node_modules" server/node_modules
          fi
          if [ "$CLIENT_DEPS" = true ] || [ ! -d "$APP/client/node_modules" ]; then
            npm ci --prefix client
          else
            cp -a --reflink=auto "$APP/client/node_modules" client/node_modules
          fi
          # Nenhum teste usa o banco/sessão do escritório. Falhas impedem a publicação.
          DATA_DIR="$STAGE/test-data" NODE_ENV=test npm test --prefix server
          npm run lint --prefix client
          if [ "$SERVER" = true ]; then
            npm run build --prefix server
            test -f server/dist/index.js
          fi
          if [ "$CLIENT" = true ]; then
            npm run build --prefix client
            test -f client/dist/index.html
          fi

          mkdir -p "$BACKUPS"
          chmod 700 "$BACKUPS"
          # Mantém só as 8 cópias de publicação mais recentes (cada uma ocupa centenas de MB).
          ls -1dt "$BACKUPS"/deploy-* 2>/dev/null | tail -n +9 | xargs -r rm -rf -- || true
          BACKUP=$(mktemp -d "$BACKUPS/deploy-$(date +%Y%m%d-%H%M%S)-XXXXXX")
          cd "$APP"
          git rev-parse HEAD > "$BACKUP/commit-anterior.txt"
          if [ "$CLIENT" = true ]; then
            tar -czf "$BACKUP/interface.tar.gz" -C /var/www disparazap
          fi
          if [ "$SERVER" = true ]; then
            pm2 stop disparador-backend
            STOPPED=true
            CHROME_PATTERN='^/home/dropsales/\.cache/puppeteer/chrome/.*--user-data-dir=/home/dropsales/disparador-sales2/server/data/wwebjs_auth/session( |$)'
            if pgrep -u "$(id -u)" -f "$CHROME_PATTERN" >/dev/null; then
              pkill -TERM -u "$(id -u)" -f "$CHROME_PATTERN" || true
            fi
            for tentativa in {1..20}; do
              if ! pgrep -u "$(id -u)" -f "$CHROME_PATTERN" >/dev/null; then break; fi
              sleep 1
            done
            if pgrep -u "$(id -u)" -f "$CHROME_PATTERN" >/dev/null; then
              echo "Chromium ainda usa a sessão; publicação interrompida."
              exit 1
            fi
            tar --exclude='server/node_modules' -czf "$BACKUP/servidor.tar.gz" server
          fi
          
          PUBLISHING=true
          git merge --ff-only "$GITHUB_SHA"
          if [ "$ROOT_DEPS" = true ]; then
            if [ -d node_modules ]; then mv node_modules "$BACKUP/root-node_modules-anterior"; fi
            mv "$STAGE/node_modules" node_modules
          fi
          if [ "$SERVER" = true ]; then
            cp -a server/dist "$BACKUP/dist-anterior"
            rm -rf server/dist
            mv "$STAGE/server/dist" server/dist
            if [ "$SERVER_DEPS" = true ]; then
              if [ -d server/node_modules ]; then mv server/node_modules "$BACKUP/node_modules-anterior"; fi
              mv "$STAGE/server/node_modules" server/node_modules
            fi
          fi
          if [ "$CLIENT" = true ]; then
            # Atualiza o cache local de dependências somente quando elas mudaram.
            if [ "$CLIENT_DEPS" = true ]; then
              if [ -d client/node_modules ]; then mv client/node_modules "$BACKUP/client-node_modules-anterior"; fi
              mv "$STAGE/client/node_modules" client/node_modules
            fi
            # Copia somente artefatos diferentes; index.html é publicado por último.
            # Assets antigos são mantidos para abas que ainda usam a versão anterior.
            python3 - "$STAGE/client/dist" /var/www/disparazap <<'PY'
          import filecmp
          import os
          import shutil
          import sys
          from pathlib import Path
          src, dst = map(Path, sys.argv[1:])
          files = sorted((p for p in src.rglob("*") if p.is_file()),
                         key=lambda p: p.relative_to(src).as_posix() == "index.html")
          for source in files:
              target = dst / source.relative_to(src)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.parent.chmod(0o755)
              if target.is_file() and filecmp.cmp(source, target, shallow=False):
                  continue
              temporary = target.with_name(target.name + ".deploy-tmp")
              shutil.copyfile(source, temporary)
              temporary.chmod(0o644)
              os.replace(temporary, target)
              print("Publicado:", source.relative_to(src))
          PY
          fi
          if [ "$SERVER" = true ]; then
            RUNNER_TRACKING_ID="" pm2 restart disparador-backend --update-env
            STOPPED=false
          fi
          for tentativa in {1..30}; do
            if curl --max-time 5 -fsS http://127.0.0.1:8081/api/health; then
              echo
              echo "Atualização seletiva concluída."
              if [ "$RUN_WHATSAPP_DIAGNOSTIC" = true ]; then
                timeout 90s node "$APP/server/scripts/diagnose-whatsapp.cjs" "$APP" --fresh || true
              fi
              exit 0
            fi
            sleep 2
          done
          echo "A API não respondeu; a versão anterior será restaurada."
          exit 1


